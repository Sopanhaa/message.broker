name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore OrderMessagingSystem.slnx

      - name: Build
        run: dotnet build OrderMessagingSystem.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: >-
          dotnet test OrderMessagingSystem.slnx
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"

  integration-test:
    name: RabbitMQ integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      rabbitmq:
        image: rabbitmq:4.2-management
        env:
          RABBITMQ_DEFAULT_USER: orderdev
          RABBITMQ_DEFAULT_PASS: orderdev_password
        ports:
          # The integration tests use the docker-compose host ports.
          - "5673:5672"
          - "15673:15672"
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore OrderMessagingSystem.slnx

      - name: Build
        run: dotnet build OrderMessagingSystem.slnx --configuration Release --no-restore -warnaserror

      - name: Run integration tests
        env:
          RABBITMQ_INTEGRATION_TESTS: "1"
        run: >-
          dotnet test OrderMessagingSystem.slnx
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~RabbitMqIntegrationTests"
          --logger "console;verbosity=normal"

  docker-build:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose --profile app config --quiet

      - name: Build API and worker images
        run: docker compose --profile app build
